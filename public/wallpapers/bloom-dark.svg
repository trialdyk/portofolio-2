<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1730"/>
      <stop offset="1" stop-color="#02050c"/>
    </linearGradient>
    <radialGradient id="glow" cx="960" cy="720" r="780" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1f63ff" stop-opacity=".38"/>
      <stop offset="1" stop-color="#1f63ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pa" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#03144f"/>
      <stop offset=".5" stop-color="#0f55d2"/>
      <stop offset="1" stop-color="#5cb8ff"/>
    </linearGradient>
    <linearGradient id="pb" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#082a86"/>
      <stop offset=".6" stop-color="#2479e6"/>
      <stop offset="1" stop-color="#93d4ff"/>
    </linearGradient>
    <linearGradient id="hl" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".72" stop-color="#bfe6ff" stop-opacity=".38"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="sh" x="-30%" y="-60%" width="160%" height="220%">
      <feDropShadow dx="0" dy="14" stdDeviation="22" flood-color="#000" flood-opacity=".6"/>
    </filter>
    <path id="petal" d="M0 0C150-130 430-170 620-60 480 50 200 80 0 0Z"/>
    <path id="fold" d="M40-8C190-110 420-130 590-58 430-40 220-20 40-8Z"/>
  </defs>
  <rect width="1920" height="1080" fill="url(#bg)"/>
  <rect width="1920" height="1080" fill="url(#glow)"/>
  <g transform="translate(960 770)">
    <g transform="rotate(-170)"><use href="#petal" xlink:href="#petal" fill="url(#pa)" filter="url(#sh)"/><use href="#fold" xlink:href="#fold" fill="url(#hl)"/></g>
    <g transform="rotate(-10) scale(1 -1)"><use href="#petal" xlink:href="#petal" fill="url(#pa)" filter="url(#sh)"/><use href="#fold" xlink:href="#fold" fill="url(#hl)"/></g>
    <g transform="rotate(-142) scale(1.05)"><use href="#petal" xlink:href="#petal" fill="url(#pb)" filter="url(#sh)"/><use href="#fold" xlink:href="#fold" fill="url(#hl)"/></g>
    <g transform="rotate(-38) scale(1.05 -1.05)"><use href="#petal" xlink:href="#petal" fill="url(#pb)" filter="url(#sh)"/><use href="#fold" xlink:href="#fold" fill="url(#hl)"/></g>
    <g transform="rotate(-116) scale(1.12)"><use href="#petal" xlink:href="#petal" fill="url(#pa)" filter="url(#sh)"/><use href="#fold" xlink:href="#fold" fill="url(#hl)"/></g>
    <g transform="rotate(-64) scale(1.12 -1.12)"><use href="#petal" xlink:href="#petal" fill="url(#pa)" filter="url(#sh)"/><use href="#fold" xlink:href="#fold" fill="url(#hl)"/></g>
    <g transform="rotate(-90) scale(1.18 1)"><use href="#petal" xlink:href="#petal" fill="url(#pb)" filter="url(#sh)"/><use href="#fold" xlink:href="#fold" fill="url(#hl)"/></g>
  </g>
</svg>
